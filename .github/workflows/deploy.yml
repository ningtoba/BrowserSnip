name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Nothing here pushes back to the repository, so the runner does not
          # need a credential left in the git config of the checked-out tree.
          persist-credentials: false

      # actions/setup-node@v4
      - uses: >-
          actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # pdfjs-dist calls Promise.withResolvers, which Node added in 22.
          # On 20 every text-extraction test dies with
          # "Promise.withResolvers is not a function" inside pdfjs, which
          # reads like a broken build rather than an old runtime. Browsers
          # are not the constraint here - the CI runner is.
          node-version: 22
          cache: npm

      - run: npm ci
      # `tsconfig.json` only covers `src`, so a test that stopped
      # compiling — an assertion against a signature the source never
      # had, a message vitest drops — was invisible to `npm run build`.
      # This step keeps that from regressing silently.
      - name: Type-check the tests
        run: npm run typecheck:tests

      # The suite is the only thing that knows a tool stopped
      # producing the right bytes; a green build only says the code
      # compiles, and this project has already shipped a white screen
      # that compiled beautifully.
      - name: Run the test suite
        run: npm test
      - run: npm run build

      # Forcefully inject the domain configuration into Vite's production bundle
      - name: Create CNAME file
        run: echo "www.browsersnip.com" > dist/CNAME

      # actions/upload-pages-artifact@v3
      - uses: >-
          actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The two grants the Pages deployment actually needs, scoped to this job
    # instead of being handed to the build job that only reads the repository.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages@v4
      - uses: >-
          actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
